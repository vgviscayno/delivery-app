name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything blocks the merge; nothing here is advisory.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # What changed decides what runs. Fixtures deliberately trigger both sides once the
  # mobile project lands (ticket 56).
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'fixtures/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'biome.jsonc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            database:
              - 'supabase/**'
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # Package unit tests never need Docker: the database work lives in its own
  # workspace with its own task.
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm check:ci
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The server-contract seam, plus the gates. Runs against a local Supabase started in
  # CI. On Supabase Free this is also the rehearsal (ADR 0012): `Migrate production`
  # refuses a commit whose `database` job did not pass.
  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Start local Supabase
        run: pnpm db:start

      # All three gates, in the one order that means anything: the RLS lint and the
      # completeness check only look at the schemas app.exposed_schemas() names, so that
      # list has to match config.toml first -- otherwise a pass from them means nothing.
      - name: The gates
        run: pnpm db:lint

      - name: pgTAP
        run: pnpm test:db

      # The generated types are committed, so a schema change and the TypeScript it
      # breaks land in the same PR.
      - name: Generated types are up to date
        run: |
          pnpm db:reset
          pnpm db:types
          git diff --exit-code -- packages/domain/src/generated/database.types.ts

      # The seed has to keep working against a real schema; it is demo data for local
      # and preview only, and is never a test input.
      - name: Seed script runs
        run: pnpm db:seed

  # The console, deployed from main only and pointed at production. There are no PR
  # previews on Supabase Free (ADR 0012): with no preview branch to point one at, a
  # preview would need production, and a preview that can write to the shop's real data
  # is worse than no preview.
  console:
    needs: [changes, typescript]
    if: github.event_name == 'push' && needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build the console
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm --filter @courier/console... build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/console/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
