name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything blocks the merge; nothing here is advisory.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # What changed decides what runs. Fixtures deliberately trigger both sides once the
  # mobile project lands (ticket 56).
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      database: ${{ steps.filter.outputs.database }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'fixtures/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            database:
              - 'supabase/**'
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            migrations:
              - 'supabase/migrations/**'

  # Package unit tests never need Docker: the database work lives in its own
  # workspace with its own task.
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The server-contract seam, plus the gates. Runs against a local Supabase started in
  # CI, never against a preview branch.
  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Start local Supabase
        run: pnpm db:start

      # The RLS lint and the completeness check only look at the schemas
      # app.exposed_schemas() names, so that list has to match config.toml first --
      # otherwise a pass means nothing.
      - name: Exposed schemas agree
        run: pnpm db:lint:schemas

      - name: RLS lint
        run: pnpm db:lint:rls

      - name: Access matrix completeness check
        run: pnpm db:lint:matrix

      - name: pgTAP
        run: pnpm test:db

      # The generated types are committed, so a schema change and the TypeScript it
      # breaks land in the same PR.
      - name: Generated types are up to date
        run: |
          pnpm db:reset
          pnpm db:types
          git diff --exit-code -- packages/domain/src/generated/database.types.ts

      # The seed has to keep working against a real schema; it is demo data for local
      # and preview only, and is never a test input.
      - name: Seed script runs
        run: pnpm db:seed

  # Every migration is rehearsed on this PR's Supabase preview branch before anyone can
  # trigger production (ADR 0009 — no staging, preview branches instead). The production
  # workflow reads this job's conclusion for the commit it is asked to push, so the
  # ordering is enforced rather than merely conventional.
  preview-rehearsal:
    needs: [changes, database]
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: ./.github/actions/setup

      - name: Resolve this PR's preview branch
        id: preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
        run: node scripts/resolve-preview-branch.mjs --git-branch "${{ github.head_ref }}" --for rehearsal

      - name: Rehearse the migrations
        env:
          SUPABASE_DB_URL: ${{ steps.preview.outputs.db_url }}
        run: pnpm --filter @courier/db push --db-url "$SUPABASE_DB_URL"

      - name: Re-run the gates against the rehearsed branch
        env:
          SUPABASE_DB_URL: ${{ steps.preview.outputs.db_url }}
        run: |
          pnpm db:lint:schemas
          pnpm db:lint:rls
          pnpm db:lint:matrix

      - name: Seed the preview branch
        env:
          SUPABASE_DB_URL: ${{ steps.preview.outputs.db_url }}
        run: pnpm db:seed

  # The console. A PR build is pointed at that PR's preview branch; main is pointed at
  # production. A PR preview is never pointed at production as a fallback — a preview
  # that can write to the shop's real data is worse than no preview — so a PR with no
  # preview branch deploys nothing rather than quietly widening its reach. The
  # integration only creates a branch for a PR that touches the Supabase directory, so a
  # TypeScript-only PR having none is normal; a migration PR having none is not.
  console:
    needs: [changes, typescript]
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: ./.github/actions/setup

      - name: Resolve the backend for this build
        id: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/resolve-preview-branch.mjs --git-branch "${{ github.head_ref }}" --for build --allow-missing
          else
            {
              echo "found=true"
              echo "api_url=${{ secrets.SUPABASE_URL }}"
              echo "anon_key=${{ secrets.SUPABASE_ANON_KEY }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: A PR that touches migrations must have a preview branch
        if: steps.backend.outputs.found != 'true' && needs.changes.outputs.migrations == 'true'
        run: |
          echo "This PR changes supabase/migrations but has no Supabase preview branch;" >&2
          echo "there is nowhere to rehearse them. Check the GitHub integration." >&2
          exit 1

      - name: Build the console
        if: steps.backend.outputs.found == 'true'
        env:
          VITE_SUPABASE_URL: ${{ steps.backend.outputs.api_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.backend.outputs.anon_key }}
        run: pnpm --filter @courier/console... build

      - name: Deploy to Cloudflare Pages
        if: steps.backend.outputs.found == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/console/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
