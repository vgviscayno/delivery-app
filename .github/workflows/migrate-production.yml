name: Migrate production

# The only path by which a migration reaches production (ADR 0009).
#
# It is manual on purpose: merging a PR does not migrate anything. The ordering the ADR
# asks for -- RLS lint, then a rehearsal on the PR's preview branch, then this -- is
# checked rather than assumed: `scripts/check-rehearsed.mjs` reads the CI run for this
# commit and refuses a push whose migrations were never rehearsed.
#
# Expand/contract binds the customer app: a migration ships before the binaries that
# depend on it, never with them.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the production Supabase project ref to confirm"
        required: true
        type: string

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse to migrate from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production migrations run from main only; this ref is ${{ github.ref }}." >&2
          exit 1

      # fetch-depth 0: the rehearsal check compares this commit's migrations against
      # those of the last successful production migration.
      - uses: ./.github/actions/setup
        with:
          fetch-depth: "0"

      - name: Check the typed confirmation
        env:
          TYPED: ${{ inputs.confirm_project_ref }}
          EXPECTED: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ "$TYPED" != "$EXPECTED" ]; then
            echo "The project ref typed does not match the production project." >&2
            exit 1
          fi

      - name: These migrations were rehearsed on a preview branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-rehearsed.mjs

      # The same gates CI ran on the PR, re-run here against a local database built
      # from exactly the migrations about to be pushed. A migration that reached main
      # by some other route still cannot get past this.
      - name: Start local Supabase
        run: pnpm db:start

      - name: Exposed schemas agree
        run: pnpm db:lint:schemas

      - name: RLS lint
        run: pnpm db:lint:rls

      - name: Access matrix completeness check
        run: pnpm db:lint:matrix

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm --filter @courier/db link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          pnpm --filter @courier/db push
