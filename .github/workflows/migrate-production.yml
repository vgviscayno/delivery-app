name: Migrate production
run-name: Migrate production (${{ inputs.push && 'push' || 'dry run' }})

# The only path by which a migration reaches production (ADR 0009, amended by 0012).
#
# It is manual on purpose: merging a PR does not migrate anything. On Supabase Free there
# are no preview branches, so the rehearsal is CI's `database` job on a local Supabase,
# and that ordering is checked rather than assumed: `scripts/check-rehearsed.mjs`
# refuses a commit whose `database` job did not pass.
#
# It takes two runs (ADR 0012). With `push` off it dry-runs against production and lists
# the migrations it would apply in the job summary. With `push` on it refuses unless a
# dry run succeeded on this same commit, then dry-runs again and pushes. The `run-name`
# is how `scripts/check-dry-run.mjs` tells the two apart: the API does not report inputs.
#
# Expand/contract binds the customer app: a migration ships before the binaries that
# depend on it, never with them.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the production Supabase project ref to confirm"
        required: true
        type: string
      push:
        description: "Push the migrations. Leave off for a dry run, which has to come first"
        required: false
        default: false
        type: boolean

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse to migrate from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production migrations run from main only; this ref is ${{ github.ref }}." >&2
          exit 1

      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Check the typed confirmation
        env:
          TYPED: ${{ inputs.confirm_project_ref }}
          EXPECTED: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ "$TYPED" != "$EXPECTED" ]; then
            echo "The project ref typed does not match the production project." >&2
            exit 1
          fi

      - name: These migrations passed the gates in CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-rehearsed.mjs

      - name: These migrations were dry-run against production first
        if: inputs.push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-dry-run.mjs

      # The same gates CI ran on the PR, re-run here against a local database built
      # from exactly the migrations about to be pushed. A migration that reached main
      # by some other route still cannot get past this.
      - name: Start local Supabase
        run: pnpm db:start

      - name: The gates
        run: pnpm db:lint

      # `run`, here and below: `link` is also a pnpm built-in, which wins over the script.
      - name: Link the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm --filter @courier/db run link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # Lists what production is missing and applies none of it. Runs on the push too,
      # so the log of the run that pushed shows what it pushed.
      # `shell: bash` for pipefail: without it a failed dry run exits through `tee` as a
      # success, and `scripts/check-dry-run.mjs` would accept it.
      - name: Dry run against production
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm --filter @courier/db run push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "### Dry run against production"
            echo
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push migrations to production
        if: inputs.push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm --filter @courier/db run push
