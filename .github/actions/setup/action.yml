name: Set up the workspace
description: Checks out the repo and installs the pnpm workspace from the lockfile.

inputs:
  fetch-depth:
    description: >-
      Checkout depth. Jobs that compare against an older commit need 0 (the full
      history); everything else is happy with a shallow clone.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
