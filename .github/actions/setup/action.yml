name: Set up the workspace
description: >-
  Installs the pnpm workspace from the lockfile. The caller checks out the repo first:
  a local action is read from the workspace, so it cannot check out the repo itself.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
